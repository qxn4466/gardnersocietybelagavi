services:
  - type: web
    name: gardner-society-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: gardner-society-db
          property: connectionString

databases:
  - name: gardner-society-db
    databaseName: gardner_society
    user: avinash
